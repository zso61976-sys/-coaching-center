server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://localhost:2006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type $content_type;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
    }

    location /iclock/ {
        proxy_pass http://localhost:2006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
    }

    location / {
        proxy_pass http://localhost:2005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# --- VPS file: /etc/nginx/sites-enabled/coaching-adms-3000.conf (added 2026-10-09) ---
# ZKTeco devices (ADMS push) configured with server port 3000 -> coaching backend
server {
    listen 3000;
    server_name _;

    location /iclock/ {
        proxy_pass http://localhost:2006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
    }

    location / {
        return 404;
    }
}
